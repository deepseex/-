<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>属性测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fce7f3 0%, #e0efff 50%, #fce7f3 100%);
            background-size: 400% 400%;
            animation: gradientFlow 18s ease infinite;
            padding: 30px 0;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes pulseWarning {
            0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.6); }
            50% { box-shadow: 0 0 28px 12px rgba(236, 72, 153, 0.4); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOutUp {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-15px); }
        }
        @keyframes rippleSpread {
            0% { transform: scale(0); opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .warning { animation: pulseWarning 1s ease-in-out 3; }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            min-height: 320px;
        }
        .question-index {
            text-align: center;
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 16px;
            animation: fadeInUp 0.4s ease;
        }
        .question {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 36px 28px;
            box-shadow: 
                0 8px 32px rgba(100, 100, 150, 0.1),
                inset 0 1px 0 rgba(255,255,255,0.8);
            animation: fadeInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }
        .question.leave { animation: fadeOutUp 0.25s ease forwards; }
        .question-title {
            font-size: 18px;
            font-weight: 500;
            color: #2a3342;
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.7;
        }
        .options {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .option-btn {
            border: none;
            border-radius: 50%;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px;
            line-height: 1.3;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.4s ease forwards;
        }
        .option-btn:nth-child(1) { animation-delay: 0.1s; }
        .option-btn:nth-child(2) { animation-delay: 0.18s; }
        .option-btn:nth-child(3) { animation-delay: 0.26s; }
        .option-btn:nth-child(4) { animation-delay: 0.34s; }
        .option-btn:nth-child(5) { animation-delay: 0.42s; }
        .option-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
        }
        .option-btn:active::after { animation: rippleSpread 0.5s ease-out; }
        .option-btn:hover { transform: scale(1.08); }
        .option-btn:active { transform: scale(0.95); }
        .option-btn.selected {
            transform: scale(1.3);
            z-index: 2;
            filter: brightness(1.18) saturate(1.3);
        }

        .opt-1 { width: 76px; height: 76px; background-color: #9333ea; font-size: 11px; }
        .opt-1.selected { box-shadow: 0 0 0 4px rgba(255,255,255,0.95), 0 0 40px 14px rgba(147, 51, 234, 0.65); }
        .opt-2 { width: 66px; height: 66px; background-color: #ec4899; font-size: 10px; }
        .opt-2.selected { box-shadow: 0 0 0 4px rgba(255,255,255,0.95), 0 0 40px 14px rgba(236, 72, 153, 0.65); }
        .opt-3 { width: 56px; height: 56px; background-color: #9ca3af; font-size: 10px; }
        .opt-3.selected { box-shadow: 0 0 0 4px rgba(255,255,255,0.95), 0 0 40px 14px rgba(156, 163, 175, 0.65); }
        .opt-4 { width: 66px; height: 66px; background-color: #60a5fa; font-size: 10px; }
        .opt-4.selected { box-shadow: 0 0 0 4px rgba(255,255,255,0.95), 0 0 40px 14px rgba(96, 165, 250, 0.65); }
        .opt-5 { width: 76px; height: 76px; background-color: #1d4ed8; font-size: 11px; }
        .opt-5.selected { box-shadow: 0 0 0 4px rgba(255,255,255,0.95), 0 0 40px 14px rgba(29, 78, 216, 0.65); }

        .nav-buttons {
            max-width: 800px;
            margin: 30px auto 0;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }
        .nav-btn {
            padding: 12px 26px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.85);
            color: #2a3342;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            flex: 1;
            font-weight: 500;
        }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn:active:not(:disabled) { transform: scale(0.96); }
        .nav-btn.primary-btn {
            background: linear-gradient(135deg, #ec4899, #3b82f6);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(236, 72, 153, 0.35);
        }
        .nav-btn.primary-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(236, 72, 153, 0.45);
        }

        /* ========== 结果页面 ========== */
        .result-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            display: none;
        }
        .result-title {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #ec4899, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            animation: fadeInUp 0.7s ease;
        }
        .result-subtitle {
            font-size: 15px;
            color: #9ca3af;
            margin-bottom: 30px;
            animation: fadeInUp 0.7s ease 0.05s both;
        }
        .result-section-title {
            font-size: 16px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 16px;
            text-align: left;
            padding-left: 12px;
            border-left: 3px solid #ec4899;
        }

        /* 金字塔布局 */
        .top-tags-pyramid {
            position: relative;
            height: 280px;
            margin: 10px 0 50px;
            animation: fadeInUp 0.8s ease 0.1s both;
        }
        .tag-rank-item {
            position: absolute;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            padding: 10px 16px;
            border-radius: 16px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .tag-rank-item:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        .tag-rank-1 {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 700;
            color: #ec4899;
            min-width: 160px;
        }
        .tag-rank-1:hover { transform: translateX(-50%) scale(1.08); }
        .tag-rank-2 {
            top: 110px;
            left: 8%;
            font-size: 22px;
            font-weight: 600;
            color: #9333ea;
            min-width: 130px;
        }
        .tag-rank-3 {
            top: 130px;
            right: 8%;
            font-size: 20px;
            font-weight: 600;
            color: #3b82f6;
            min-width: 120px;
        }
        .tag-rank-badge {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
            font-weight: normal;
        }
        .tag-rank-score {
            font-size: 13px;
            color: #6b7280;
            margin-top: 2px;
            font-weight: 500;
        }

        /* 五维柱状图 */
        .charts-wrapper {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px 24px;
            box-shadow: 0 4px 20px rgba(100,100,150,0.06);
            margin-bottom: 40px;
        }
        .charts-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
            animation: fadeInUp 0.9s ease 0.3s both;
            padding-top: 20px;
        }
        .chart-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
            flex: 1;
            min-width: 50px;
            max-width: 70px;
        }
        .chart-item:nth-child(1) { animation-delay: 0.4s; }
        .chart-item:nth-child(2) { animation-delay: 0.5s; }
        .chart-item:nth-child(3) { animation-delay: 0.6s; }
        .chart-item:nth-child(4) { animation-delay: 0.7s; }
        .chart-item:nth-child(5) { animation-delay: 0.8s; }
        .bar-chart {
            width: 100%;
            height: 180px;
            background-color: #f3f4f6;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
            position: relative;
        }
        .bar-fill {
            width: 100%;
            height: 0;
            border-radius: 10px 10px 0 0;
            transition: height 1.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .bar-fill::after {
            content: attr(data-percent);
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            opacity: 0;
            animation: floatUp 0.3s ease forwards;
            animation-delay: 1.2s;
        }
        .chart-label {
            font-size: 14px;
            color: #374151;
            font-weight: 500;
        }

        /* 结果按钮组 */
        .result-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ========== 历史记录页面 ========== */
        .history-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            display: none;
        }
        .history-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #ec4899, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            animation: fadeInUp 0.7s ease;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            min-height: 200px;
        }
        .history-item {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 2px 12px rgba(100, 100, 150, 0.06);
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            border-left: 4px solid #ec4899;
        }
        .history-item-content { flex: 1; }
        .history-time {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .history-attr {
            font-size: 17px;
            font-weight: 600;
            color: #ec4899;
            margin-bottom: 4px;
        }
        .history-tags {
            font-size: 14px;
            color: #4b5563;
            line-height: 1.5;
        }
        .history-empty {
            text-align: center;
            color: #9ca3af;
            padding: 80px 0;
            font-size: 15px;
            background: rgba(255,255,255,0.5);
            border-radius: 16px;
            backdrop-filter: blur(8px);
        }
        .history-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        /* ========== 弹窗 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-box {
            background: rgba(255,255,255,0.98);
            border-radius: 20px;
            padding: 36px 28px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: fadeInUp 0.4s ease;
        }
        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #ec4899;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-desc {
            font-size: 16px;
            line-height: 1.8;
            color: #2a3342;
            margin-bottom: 28px;
            text-align: justify;
        }
        .modal-close {
            display: block;
            margin: 0 auto;
            padding: 12px 36px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ec4899, #3b82f6);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.3s ease;
            font-weight: 500;
        }
        .modal-close:hover { transform: translateY(-2px); }

        @media (max-width: 600px) {
            body { padding: 20px 0; }
            .question { padding: 24px 18px; }
            .question-title { font-size: 16px; margin-bottom: 24px; }
            .options { gap: 8px; }
            .opt-1 { width: 58px; height: 58px; font-size: 10px; }
            .opt-2 { width: 50px; height: 50px; font-size: 9px; }
            .opt-3 { width: 44px; height: 44px; font-size: 9px; }
            .opt-4 { width: 50px; height: 50px; font-size: 9px; }
            .opt-5 { width: 58px; height: 58px; font-size: 10px; }
            .result-title { font-size: 28px; }
            .bar-chart { height: 140px; }
            .charts-wrapper { padding: 20px 16px; }
            .nav-btn { padding: 10px 16px; font-size: 15px; }
            .nav-buttons { padding: 0 12px; }
            .tag-rank-1 { font-size: 22px; min-width: 120px; }
            .tag-rank-2 { font-size: 17px; left: 5%; min-width: 100px; }
            .tag-rank-3 { font-size: 16px; right: 5%; min-width: 100px; }
            .top-tags-pyramid { height: 240px; }
            .result-buttons { flex-direction: column; }
            .history-item { flex-direction: column; align-items: flex-start; gap: 8px; }
        }
    </style>
</head>
<body>
    <!-- 答题页面 -->
    <div class="quiz-container" id="quizContainer">
        <div class="question-index" id="questionIndex">第 1 题 / 共 50 题</div>
        <div class="question" id="questionBox"></div>
    </div>
    <div class="nav-buttons" id="quizNav">
        <button class="nav-btn prev-btn" id="prevBtn">上一题</button>
        <button class="nav-btn primary-btn next-btn" id="nextBtn">下一题</button>
    </div>

    <!-- 结果页面 -->
    <div class="result-container" id="resultContainer">
        <h1 class="result-title" id="resultTitle"></h1>
        <p class="result-subtitle">点击标签查看详细解析</p>

        <div class="result-section-title">核心角色标签</div>
        <div class="top-tags-pyramid" id="pyramidBox"></div>

        <div class="charts-wrapper">
            <div class="result-section-title" style="margin-bottom: 0;">五维属性分布</div>
            <div class="charts-container" id="chartsBox"></div>
        </div>

        <div class="result-buttons">
            <button class="nav-btn" onclick="restartQuiz()">重新答题</button>
            <button class="nav-btn primary-btn" onclick="showHistory()">查看历史记录</button>
        </div>
    </div>

    <!-- 历史记录页面 -->
    <div class="history-container" id="historyContainer">
        <h2 class="history-title">答题记录</h2>
        <div class="history-list" id="historyList"></div>
        <div class="history-buttons">
            <button class="nav-btn" onclick="backToResult()">返回结果</button>
            <button class="nav-btn primary-btn" onclick="clearHistory()">清空记录</button>
        </div>
    </div>

    <!-- 标签详情弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-desc" id="modalDesc"></div>
            <button class="modal-close" onclick="closeModal()">关闭</button>
        </div>
    </div>

        // ----------------------------------------------------------------

            { text: '不太符合', score: 1, class: 'opt-2' },
            { text: '一般/不确定', score: 2, class: 'opt-3' },

        // 属性分组
        const attributes = [
            { name: 'sado', start: 1, end: 10 },
            { name: 'dom', start: 11, end: 20 },
            { name: 'switch', start: 21, end: 30 },

        // 标签列表
        const tags = [

            {

            },

                desc: '你在亲密关系里风格灵活，习惯按照自己的节奏调整状态。你既能够构思各类有趣的互动场景，也很享受置身其中的体验，可以在不同的角色状态间自然切换，更偏爱由自己主导探索的步调。',

                questions: [28, 26, 36, 39, 40]
            },
            {
                id: '小宠物',
                desc: '你向往简单纯粹的亲密状态，乐于在信任的人面前卸下所有防备与社会身份。你享受被照顾、被呵护的感觉，喜欢全然放松地依附对方，在这样的相处里，你能获得最松弛、最安心的情绪体验。',
                questions: [34, 37, 38, 41, 42]
            },
            {
                id: '物化者',
                desc: '你在亲密互动中倾向于弱化自我意识，希望暂时放下日常的身份与体面。你享受被主导、被对待的过程，通过这样的互动卸下日常积累的压力与负担，获得一种彻底放松的情绪释放。',
                questions: [31, 35, 43, 45, 50]
            },
            {
                id: '负罪徒',
                desc: '你会将带有张力的互动与被重视的感觉相关联，认为强烈的情绪反馈是关系里存在感的证明。你习惯在带有碰撞感的相处中获得内心的安定，以此确认自己在对方心中的分量与位置。',
                questions: [44, 46, 47, 48, 49]
            }
        ];

        const colorScale = [
            '#FFFFFF', '#FFE5F3', '#FFCBE7', '#FFB1DB', '#FF97CF',
            '#FF7CC3', '#FF62B7', '#FF48AB', '#FF2E9F', '#FF1493'
        ];

        // ================================================================
        // 【核心计算逻辑】
        // ================================================================

        const currentIndex = { value: 0 };
        const scores = new Array(TOTAL_QUESTIONS).fill(null);
        let isSwitching = false;

        // 随机打乱出场顺序
        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        let shuffleOrder = shuffleArray([...Array(TOTAL_QUESTIONS).keys()]);

        // 分数预处理：反向计分 + 加权调整
        function getFinalScores() {
            return scores.map((s, i) => {
                let score = s;
                // 第一步：反向题反转
                if (REVERSE_INDEXES.includes(i)) {
                    score = 4 - score;
                }
                // 第二步：加权调整
                if (ADJUST_INDEXES.includes(i)) {
                    score = score + (score - 2) * 1.5;
                }
                return score;
            });
        }

        // ================================================================
        // 【工具函数】
        // ================================================================
        const questionBox = document.getElementById('questionBox');
        const questionIndex = document.getElementById('questionIndex');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const quizContainer = document.getElementById('quizContainer');
        const resultContainer = document.getElementById('resultContainer');
        const historyContainer = document.getElementById('historyContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');

        function getColor(percent) {
            const idx = Math.min(Math.floor(percent / 10), 9);
            return colorScale[Math.max(0, idx)];
        }

        function darkenColor(hex, percent) {
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            const nr = Math.max(0, Math.round(r * (1 - percent/100)));
            const ng = Math.max(0, Math.round(g * (1 - percent/100)));
            const nb = Math.max(0, Math.round(b * (1 - percent/100)));
            return `#${nr.toString(16).padStart(2,'0')}${ng.toString(16).padStart(2,'0')}${nb.toString(16).padStart(2,'0')}`;
        }

        function createBar(percent, color) {
            const dark = darkenColor(color, 15);
            const gradient = `linear-gradient(to top, ${color}, ${dark})`;
            return `<div class="bar-chart">
                <div class="bar-fill" style="background: ${gradient};" data-percent="${percent.toFixed(0)}%"></div>
            </div>`;
        }

        // 弹窗控制
        function showTagDetail(tag) {
            modalTitle.textContent = tag.id;
            modalDesc.textContent = tag.desc;
            modalOverlay.style.display = 'flex';
        }
        function closeModal() {
            modalOverlay.style.display = 'none';
        }
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // ================================================================
        // 【历史记录功能】
        // ================================================================
        function saveHistory(topAttr, top3Tags) {
            const record = {
                time: new Date().toLocaleString('zh-CN'),
                attr: topAttr.name,
                tags: top3Tags.map(t => t.id)
            };
            const history = JSON.parse(localStorage.getItem('quizHistory') || '[]');
            history.unshift(record);
            if (history.length > 20) history.pop();
            localStorage.setItem('quizHistory', JSON.stringify(history));
        }

        function renderHistoryList() {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('quizHistory') || '[]');
            
            if (history.length === 0) {
                list.innerHTML = '<div class="history-empty">暂无答题记录</div>';
                return;
            }

            let html = '';
            history.forEach((item, i) => {
                html += `<div class="history-item" style="animation-delay: ${i * 0.05}s">
                    <div class="history-item-content">
                        <div class="history-time">${item.time}</div>
                        <div class="history-attr">主导属性：${item.attr}</div>
                        <div class="history-tags">前三标签：${item.tags.join('、')}</div>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
        }

        function showHistory() {
            resultContainer.style.display = 'none';
            historyContainer.style.display = 'block';
            renderHistoryList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToResult() {
            historyContainer.style.display = 'none';
            resultContainer.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearHistory() {
            if (confirm('确定要清空所有答题记录吗？')) {
                localStorage.removeItem('quizHistory');
                renderHistoryList();
            }
        }

        // ================================================================
        // 【重新答题】
        // ================================================================
        function restartQuiz() {
            scores.fill(null);
            currentIndex.value = 0;
            shuffleOrder = shuffleArray([...Array(TOTAL_QUESTIONS).keys()]);
            
            resultContainer.style.display = 'none';
            historyContainer.style.display = 'none';
            quizContainer.style.display = 'block';
            document.getElementById('quizNav').style.display = 'flex';
            
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================================================================
        // 【渲染逻辑】
        // ================================================================
        function renderQuestion() {
            const idx = currentIndex.value;
            const rawIdx = shuffleOrder[idx];
            const q = questions[rawIdx];
            const currentScore = scores[rawIdx];

            questionIndex.textContent = `第 ${idx + 1} 题 / 共 ${TOTAL_QUESTIONS} 题`;

            let html = `<div class="question-title">${q}</div><div class="options">`;
            options.forEach((opt) => {
                const selected = currentScore === opt.score ? ' selected' : '';
                html += `<button class="option-btn ${opt.class}${selected}" data-score="${opt.score}">${opt.text}</button>`;
            });
            html += '</div>';

            questionBox.innerHTML = html;

            questionBox.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const score = parseInt(btn.dataset.score);
                    scores[rawIdx] = score;
                    questionBox.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
            });

            prevBtn.disabled = idx === 0;
            nextBtn.textContent = idx === TOTAL_QUESTIONS - 1 ? '提交答案' : '下一题';
        }

        function switchQuestion(direction) {
            if (isSwitching) return;
            isSwitching = true;
            questionBox.classList.add('leave');

            setTimeout(() => {
                currentIndex.value += direction;
                renderQuestion();
                questionBox.classList.remove('leave');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                isSwitching = false;
            }, 250);
        }

        function jumpToUnanswered(index) {
            currentIndex.value = index;
            renderQuestion();
            questionBox.classList.add('warning');
            setTimeout(() => questionBox.classList.remove('warning'), 3000);
        }

        function showResult() {
            const finalScores = getFinalScores();

            // 计算五大属性
            attributes.forEach(attr => {
                let sum = 0;
                for (let i = attr.start - 1; i < attr.end; i++) {
                    sum += finalScores[i];
                }
                attr.score = sum;
                attr.percent = Math.min(100, Math.max(0, sum * 2.5));
                attr.color = getColor(attr.percent);
            });

            // 计算标签基础分
            tags.forEach(tag => {
                let sum = 0;
                tag.questions.forEach(q => {
                    sum += finalScores[q - 1];
                });
                tag.score = sum;
            });

            // 最高属性
            const topAttr = attributes.reduce((a, b) => a.score > b.score ? a : b);

            // 属性对应标签加分
            const bonusMap = ATTR_TAG_BONUS[topAttr.name];
            if (bonusMap) {
                tags.forEach(tag => {
                    if (bonusMap[tag.id]) {
                        tag.score += bonusMap[tag.id];
                    }
                });
            }

            // 排序取前三
            const sortedTags = [...tags].sort((a, b) => b.score - a.score);
            const top3 = sortedTags.slice(0, 3);

            // 保存历史
            saveHistory(topAttr, top3);

            // 渲染结果标题
            document.getElementById('resultTitle').textContent = '测试结果：' + topAttr.name;

            // 渲染金字塔
            let pyramidHtml = '';
            top3.forEach((tag, i) => {
                const rank = i + 1;
                pyramidHtml += `
                <div class="tag-rank-item tag-rank-${rank}" data-tag-id="${tag.id}">
                    ${tag.id}
                    <div class="tag-rank-badge">TOP ${rank}</div>
                    <div class="tag-rank-score">${tag.score.toFixed(1)}分</div>
                </div>`;
            });
            document.getElementById('pyramidBox').innerHTML = pyramidHtml;

            // 渲染柱状图
            let chartsHtml = '';
            attributes.forEach(attr => {
                chartsHtml += `<div class="chart-item">
                    ${createBar(attr.percent, attr.color)}
                    <div class="chart-label">${attr.name}</div>
                </div>`;
            });
            document.getElementById('chartsBox').innerHTML = chartsHtml;

            // 绑定标签点击
            document.querySelectorAll('.tag-rank-item').forEach(item => {
                item.addEventListener('click', () => {
                    const tagId = item.dataset.tagId;
                    const tag = tags.find(t => t.id === tagId);
                    if (tag) showTagDetail(tag);
                });
            });

            // 切换页面
            quizContainer.style.display = 'none';
            document.querySelector('.nav-buttons').style.display = 'none';
            resultContainer.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 柱状图动画
            setTimeout(() => {
                const bars = document.querySelectorAll('.bar-fill');
                const percents = attributes.map(a => a.percent);
                bars.forEach((bar, i) => {
                    setTimeout(() => {
                        bar.style.height = percents[i] + '%';
                    }, i * 100);
                });
            }, 300);
        }

        function calculateResult() {
            const firstUnanswered = scores.findIndex(s => s === null);
            if (firstUnanswered !== -1) {
                const orderIdx = shuffleOrder.indexOf(firstUnanswered);
                jumpToUnanswered(orderIdx);
                return;
            }
            showResult();
        }

        // ================================================================
        // 【事件绑定 & 初始化】
        // ================================================================
        prevBtn.addEventListener('click', () => {
            if (currentIndex.value > 0) switchQuestion(-1);
        });
        nextBtn.addEventListener('click', () => {
            if (currentIndex.value < TOTAL_QUESTIONS - 1) {
                switchQuestion(1);
            } else {
                calculateResult();
            }
        });

        renderQuestion();
    </script>
